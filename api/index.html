<body>
<main>
  <h1>查词</h1>
  <p class="lead">打一个黑话，或者它的白话说法，看看它落在哪些组、另一种语言怎么说。</p>

  <form method="get">
    <div class="field">
      <label for="word">要查的词</label>
      <input id="word" name="word" type="text" autocomplete="off" spellcheck="false" placeholder="比如：咬人 / bite">
    </div>
    <div class="field lang-field">
      <label for="lang">按哪种语言查</label>
      <select id="lang" name="lang">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <button type="submit">查</button>
  </form>

  <section id="result" aria-live="polite"></section>

  <footer>
    <p>这个词库在 <a id="repo-link" href="https://github.com/Xxx91n/jiahao-word">GitHub 上</a>。</p>
  </footer>
</main>

var WHITESPACE = ["\t","\n","\u000b","\f","\r","\u001c","\u001d","\u001e","\u001f"," ","\u0085","\u00a0","\u1680","\u2000","\u2001","\u2002","\u2003","\u2004","\u2005","\u2006","\u2007","\u2008","\u2009","\u200a","\u2028","\u2029","\u202f","\u205f","\u3000"];

function foldEnglish(text) {
  var out = "";
  Array.from(text).forEach(function (ch) {
    out += Object.prototype.hasOwnProperty.call(CASE_FOLD, ch) ? CASE_FOLD[ch] : ch;
  });
  return out;
}

function stripWhitespace(text) {
  var start = 0;
  var end = text.length;
  while (start < end && WHITESPACE.indexOf(text.charAt(start)) !== -1) start += 1;
  while (end > start && WHITESPACE.indexOf(text.charAt(end - 1)) !== -1) end -= 1;
  return text.slice(start, end);
}

// 查表前把现场输入整理成和生成数据一样的写法：去首尾空格，英文按 casefold 折叠。
function normalizeQuery(lang, raw) {
  var text = stripWhitespace(String(raw == null ? "" : raw));
  return lang === "en" ? foldEnglish(text) : text;
}

function makeElement(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = String(text);
  return node;
}

function groupNumber(groupId) {
  var found = /^g([0-9]+)$/.exec(String(groupId || ""));
  return found ? Number(found[1]) : 0;
}

function otherLanguages(lang) {
  return SEARCH_LANGS.filter(function (other) { return other !== lang; });
}

function languagesInOrder(lang) {
  return [lang].concat(otherLanguages(lang));
}

function entriesFor(candidate, lang) {
  var source = Array.isArray(candidate[lang]) ? candidate[lang] : [];
  return source.slice().sort(function (a, b) {
    var left = normalizeQuery(lang, a.word);
    var right = normalizeQuery(lang, b.word);
    if (left < right) return -1;
    if (left > right) return 1;
    return 0;
  });
}

function renderEntry(entry) {
  var item = makeElement("li", "entry");
  item.append(makeElement("span", "kind kind-" + (entry.kind === "jargon" ? "jargon" : "plain"),
    KIND_NAMES[entry.kind] || "词"));
  item.append(makeElement("span", "word", entry.word));
  if (entry.env) item.append(makeElement("span", "env", "用在：" + entry.env));
  var issue = Number(entry.issue);
  if (Number.isInteger(issue) && issue > 0) {
    var link = makeElement("a", "issue", "#" + issue);
    link.href = REPO_URL + "/issues/" + issue;
    item.append(link);
  }
  return item;
}

function renderCandidate(candidate, lang) {
  var card = makeElement("section", "card");
  var head = makeElement("h2", "card-head");
  head.append(makeElement("span", "gid", candidate.group || "组号没写"));
  head.append(makeElement("span", "label", (candidate.label && candidate.label.trim()) || "这个组没有标签"));
  card.append(head);

  languagesInOrder(lang).forEach(function (shown) {
    var block = makeElement("div", "lang-block");
    block.append(makeElement("h3", "lang-name", LANG_NAMES[shown] || shown));
    var entries = entriesFor(candidate, shown);
    if (entries.length === 0) {
      block.append(makeElement("p", "empty", "这个语言暂时没说法"));
    } else {
      var list = makeElement("ul", "entries");
      entries.forEach(function (entry) { list.append(renderEntry(entry)); });
      block.append(list);
    }
    card.append(block);
  });

  return card;
}

function showCandidates(candidates, lang, word) {
  var box = document.getElementById("result");
  box.replaceChildren();
  box.append(makeElement("p", "note",
    "按" + (LANG_NAMES[lang] || lang) + "查「" + word + "」，查到 " + candidates.length + " 个组。"));

  candidates.slice().sort(function (a, b) {
    return groupNumber(a && a.group) - groupNumber(b && b.group);
  }).forEach(function (candidate) {
    box.append(renderCandidate(candidate || {}, lang));
  });
}

function showMissing(lang, original, data) {
  var box = document.getElementById("result");
  box.replaceChildren();

  // 这个词可能只是换个语言查就有，那就别跟人说「库里还没有」。
  // 另一门语言要按它自己的规则重新归一化，不能直接用这门语言算好的键。
  var elsewhere = [];
  otherLanguages(lang).forEach(function (other) {
    var key = normalizeQuery(other, original);
    var bucket = data && data.words && data.words[other];
    if (bucket && Object.prototype.hasOwnProperty.call(bucket, key) && bucket[key].length > 0) {
      elsewhere.push(other);
    }
  });

  var shown = stripWhitespace(original);

  if (elsewhere.length > 0) {
    box.append(makeElement("p", "notice",
      (LANG_NAMES[lang] || lang) + "里没有这个词，但" +
      elsewhere.map(function (other) { return LANG_NAMES[other] || other; }).join("、") + "里有。"));
    elsewhere.forEach(function (other) {
      var line = makeElement("p", "note");
      var link = makeElement("a", null, "按" + (LANG_NAMES[other] || other) + "查这个字串");
      link.href = "?word=" + encodeURIComponent(shown) + "&lang=" + other;
      line.append(link, document.createTextNode("。"));
      box.append(line);
    });
    return;
  }

  box.append(makeElement("p", "notice", "库里还没有这个词。"));
  box.append(makeElement("p", "note",
    "按" + (LANG_NAMES[lang] || lang) + "查「" + shown + "」，没有收录。"));

  appendNewEntryLink(box);
}

function appendNewEntryLink(box) {
  var line = makeElement("p", "note");
  var link = makeElement("a", null, "开一个新词 issue");
  link.href = REPO_URL + "/issues/new?template=new-entry.yml";
  line.append(link, document.createTextNode("，把这个词提进来。"));
  box.append(line);
}

function showHint() {
  var box = document.getElementById("result");
  box.replaceChildren();
  box.append(makeElement("p", "note", "输入一个词，再点「查」。"));
}

function showLoadFailure(reason) {
  var box = document.getElementById("result");
  box.replaceChildren();
  box.append(makeElement("p", "notice", "数据没取到。"));
  box.append(makeElement("p", "note",
    "浏览器没读到同目录的 data.json。直接用本地文件打开时会被拦住，换个网址访问或者起一个本地服务器再看。"));
  if (reason) console.error(reason);
}

function lookUp(word, lang, original) {
  return fetch("./data.json", { cache: "no-cache" }).then(function (response) {
    if (!response.ok) throw new Error("取数据失败，状态码 " + response.status);
    return response.json();
  }).then(function (data) {
    var words = data && data.words;
    var bucket = words && words[lang];
    var candidates = bucket && Object.prototype.hasOwnProperty.call(bucket, word)
      ? bucket[word]
      : [];
    if (!Array.isArray(candidates) || candidates.length === 0) {
      showMissing(lang, original, data);
      return;
    }
    showCandidates(candidates, lang, word);
  }).catch(showLoadFailure);
}

(function start() {
  var params = new URLSearchParams(window.location.search);
  var rawWord = params.get("word") || "";
  var lang = pickLanguage(params.get("lang"));
  var word = normalizeQuery(lang, rawWord);

  var input = document.getElementById("word");
  var select = document.getElementById("lang");
  if (input) input.value = rawWord.trim();
  if (select) select.value = lang;

  if (!word) {
    showHint();
    return;
  }
  lookUp(word, lang, rawWord);
})();
