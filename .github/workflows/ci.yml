name: 检查

on:
  push:
    branches: [main]
  pull_request:
    # edited 也跑，改了 PR 描述会重新检查人话说明。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: 跑测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: 跑测试
        run: python -m pytest -q

  data:
    name: 数据检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check .
      - name: 检查 groups/
        run: python -m jiahao_word check

  drift:
    name: 生成文件漂移
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check .
      - name: 重新生成
        run: python -m jiahao_word build
      - name: 检查生成文件有没有漂移
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "生成文件和仓库里提交的不一样："
            git diff
            printf '%s\n' "$changed"
            echo "跑 python -m jiahao_word build 后，把生成结果一起提交。"
            exit 1
          fi
          echo "生成文件和仓库里提交的一致。"

  pr-note:
    name: PR 人话说明
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check .
      - name: 检查 PR 描述
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PYTHONIOENCODING: utf-8
        run: printf '%s' "$PR_BODY" | python -m jiahao_word check-pr
